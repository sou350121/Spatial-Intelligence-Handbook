name: Pulsar Spatial Daily

# Runs every weekday 00:30 UTC (≈ 08:30 CN time, after arxiv RSS refresh).
# Generates reports/spatial-daily/YYYY-MM-DD.md from arxiv cs.RO/CV/AI/LG.
#
# Required GitHub Secrets (Settings → Secrets → Actions) — at least one:
#   DEEPSEEK_API_KEY  — DeepSeek deepseek-flash (primary since 2026-09-10)
#   DASHSCOPE_API_KEY — Aliyun qwen (fallback; the 2026-05-24 key is revoked,
#                       which is what produced 8 days of placeholder reports)
#
# Manual trigger: Actions tab → Pulsar Spatial Daily → Run workflow.

on:
  schedule:
    # Mon-Fri only (arxiv 沒週末發新)
    - cron: '30 0 * * 1-5'
  workflow_dispatch:  # manual trigger

permissions:
  contents: write  # need to push back to main
  issues: write    # failure sentinel opens/comments an issue

concurrency:
  group: pulsar-spatial-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history to pull/rebase

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Pulsar pipeline
        env:
          # DeepSeek is primary; DASHSCOPE stays as the qwen fallback.
          # Either alone is enough to run — scripts/pulsar/_llm.py logs
          # loudly and fails the step when neither works.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          python3 scripts/pulsar/run_daily.py

      # Commit the dated archive FIRST, before any audit. The daily report is
      # append-only archive content (reports/spatial-daily/) and must never be
      # silently discarded because of unrelated handbook drift elsewhere. The
      # full-handbook audit runs afterwards as an informational signal only; the
      # separate audit.yml workflow remains the real gate for content PRs/pushes.
      - name: Commit + push (if changed)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure git
          git config user.name "Pulsar Bot"
          git config user.email "noreply@anthropic.com"

          # Add scoped changes only (don't accidentally commit anything else).
          # reports/atlas/ = the 5-axis coordinate stream (atlas.jsonl) + its
          # generated overview, written by post.py alongside the daily report.
          git add reports/spatial-daily/ reports/atlas/

          # Exit cleanly if nothing changed (e.g. weekend or zero qualifying papers)
          if git diff --staged --quiet; then
            echo "No new spatial-daily report — skipping commit."
            exit 0
          fi

          # Persist the dedup caches. This runner is stateless: every run starts
          # from a fresh actions/checkout, so scripts/pulsar/state/ came back
          # empty each morning, load_seen() returned {} and the 60-day dedup in
          # collect.py never fired once — 478 cross-day re-emissions of the same
          # arXiv id across reports/spatial-daily/, 477 of them inside the window
          # (measured 2026-09-16). The repo is the only durable store here.
          #
          # Staged AFTER the no-change check on purpose: the caches are rewritten
          # on every run (pruning alone changes them), so staging them earlier
          # would turn "nothing to report" into a daily empty commit.
          git add scripts/pulsar/state/seen_arxiv_ids.json scripts/pulsar/state/curated_seen.json

          # 2026-09-16: sync BEFORE the commit, not in the informational audit step

          # below. atlas.py regenerates reports/atlas/overview.md during the daily

          # run, but README.md is a generated mirror of it -- and the sync used to

          # live AFTER `git push`, so every day this workflow pushed an overview.md

          # its README.md did not match, repaired the mismatch inside the runner,

          # and threw the repair away. The daily job reported success while the tree

          # it had just published was red, and the Handbook Audit triggered by that

          # push failed. Observed 2026-09-16: README said 2163 papers / 09-15 while

          # overview said 2223 / 09-16.

          #

          # The audit itself stays informational and stays after the push -- that is

          # deliberate (never lose the day's archive over a count). Only sync moves.

          python3 scripts/sync_readme_from_overview.py || true

          git add -A reports/ || true


          # Commit with date in message (use here-doc to keep YAML indentation safe)
          DATE=$(date +%F)
          MSG=$(cat <<EOF
          auto(pulsar): spatial daily ${DATE}

          Generated by GitHub Actions workflow .github/workflows/pulsar-spatial-daily.yml
          Pipeline: collect.py → rate.py (deepseek-flash, qwen fallback) → post.py
          EOF
          )
          git commit -m "$MSG"

          # Rebase AFTER commit — git refuses to pull-rebase with a staged index,
          # so pulling before commit kills every run that has a report to save.
          git pull --rebase origin main || {
            echo "Rebase failed — manual intervention needed."
            exit 1
          }

          # Push (retry once on conflict)
          git push origin main || {
            echo "Push conflict, retrying after rebase..."
            git pull --rebase origin main
            git push origin main
          }

      # Informational only — never blocks (or reverts) the archive commit above.
      - name: Handbook audit (informational)
        if: always()
        continue-on-error: true
        run: |
          python3 scripts/sync_readme_from_overview.py || true
          python3 scripts/handbook_audit.py

      # Sentinel: this pipeline silently produced nothing for weeks, twice.
      # Any step failure now surfaces as an issue instead of an ignored email.
      - name: Alert on failure (sentinel issue)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="[pipeline-alert] Pulsar spatial daily is failing"
          BODY="Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} ($(date -u +%FT%TZ))"
          NUM=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty' || true)
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Clear the alert if we recovered (sentinel)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The failure() step above opens (or comments on) an alert issue, but
          # nothing ever closed one. Spatial #3 and Physics #2 both stayed open
          # long after the 2026-08-21 DashScope-arrearage failures self-healed on
          # 08-28, so "an open pipeline-alert" stopped meaning "currently broken"
          # — which is the only thing that made it worth reading.
          TITLE="[pipeline-alert] Pulsar spatial daily is failing"
          NUM=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty' || true)
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "Recovered: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} succeeded at $(date -u +%FT%TZ)"
            gh issue close "$NUM"
            echo "closed #$NUM"
          fi
