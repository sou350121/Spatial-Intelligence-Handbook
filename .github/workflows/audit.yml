name: Handbook Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    name: Run handbook_audit.py
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Anti-fabrication gate regression
        # The gate has failed in both directions: crying wolf (2026-08-24, 6 of 7
        # findings false) and going blind-then-rejecting-everything (2026-08-28..
        # 09-15, 18 days with zero articles). Both incidents are pinned here.
        run: python scripts/pulsar/test_gates.py

      - name: Run audit
        run: python scripts/handbook_audit.py

      # Added 2026-09-15. GitHub secret scanning AND push protection are both
      # enabled on this repo and both missed a real DashScope key that sat in
      # MAINTAINER.md and docs/pulsar-integration.md from the initial commit
      # until 2026-09-10 -- zero alerts, because GitHub's scanner does not know
      # Alibaba's key format. That key was most likely revoked by Alibaba's own
      # scraping of public GitHub, which cost twelve days of dead pipeline. This
      # step checks the formats we actually use.
      - name: Refuse credentials in tracked files
        run: python scripts/pulsar/check_secrets.py